<style>
/* Look: a warm parchment house. Cream ground, oat and sand surfaces, espresso ink, and ONE accent of burnished brass
   (prices, links, selection, my chat bubbles). Primary buttons are espresso with cream type, like a gallery label.
   One rich dark field (espresso) per long screen. Photos sit on sand-coloured mats, so they glow against the cream.
   Palette chosen with ui-ux-pro-max ("E-commerce Luxury": premium dark + gold; "warm ink on cream"), taken from the materials: walnut, leather, clay, brass. */
:root {
  color-scheme: light;
  --paper: #f3ebdd;      /* parchment cream: the ground */
  --stone: #e8dcc7;      /* oat: quiet panels, chips, the segmented control (ink 11.8:1) */
  --sand: #dccbb0;       /* sand: photo mats and placeholders */
  --surface: #faf5ec;    /* ivory: raised things (cards, inputs, bubbles). Never pure white */
  --ink: #2b1f17;        /* espresso ink, 13.5:1 on parchment */
  --muted: #6a5848;      /* walnut grey, 5.7:1 on parchment, 5.0:1 on oat */
  --line: #d9c9ae;
  --accent: #7a5418;     /* burnished brass, 5.7:1 on parchment, 6.2:1 under ivory text */
  --accent-soft: #eedfc2;
  --on-accent: #faf5ec;
  --action: #2b1f17;     /* primary buttons: espresso */
  --on-action: #f3ebdd;
  --heart: #9e2f2a;      /* garnet */
  --warn: #8e3a1c;
  --warn-soft: #f1dccd;
  --placeholder: #dccbb0;
  --on-image: #fbf6ee;
  --on-image-ink: #2b1f17;
  --field: #2a1e16;      /* the one dark field: espresso, like an oiled walnut board */
  --on-field: #f3ebdd;
  --field-muted: #c9b79f; /* 8.3:1 on the field */
  --field-num: #d2a85e;   /* brass, lifted for the dark field (7.3:1) */
  --r-img: 4px;          /* photographs sit like prints: almost square */
  --r-panel: 14px;
  --ease: cubic-bezier(.16, 1, .3, 1);     /* slow, confident arrival */
  --ease-soft: cubic-bezier(.45, 0, .25, 1);
  --display: "Frank Ruhl Libre", "Bellefair", "Times New Roman", serif;
  --body: "IBM Plex Sans Hebrew", "Assistant", "Segoe UI", Arial, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
  --kb: 0px;              /* height of the on-screen keyboard, set by script */
  --composer-h: 60px;     /* measured by script */
  --nav-h: 62px;
}
html, body { background: var(--paper); color: var(--ink); margin: 0; }
body { font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
::selection { background: var(--accent-soft); color: var(--ink); }
input, textarea { caret-color: var(--accent); }
::placeholder { color: #766555; } /* 5.1:1 on ivory */
h1, h2, h3 { text-wrap: balance; }
img { -webkit-user-drag: none; user-select: none; }

.app { max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--paper); position: relative; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
@media (min-width: 480px) { .app { border-inline: 1px solid var(--line); } }
.g { padding-left: var(--gl); padding-right: var(--gr); }
.bleed { margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr)); }
.demo-note { font-size: 12px; letter-spacing: .02em; color: var(--muted); text-align: center; padding-block: 7px; background: var(--stone); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); display: flex; align-items: center; gap: 12px; min-height: 60px; padding-block: 8px; }
.wordmark { font-family: var(--display); font-weight: 500; font-size: 33px; line-height: .95; flex: 1; letter-spacing: -.01em; }
.wordmark small { display: block; font-family: var(--body); font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 5px; }
.top h1 { font-family: var(--display); font-weight: 500; font-size: 23px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--stone); display: grid; place-items: center; flex: none; padding: 0; }
.round svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.me-btn { font-family: var(--display); font-weight: 500; font-size: 19px; background: var(--ink); color: var(--paper); }

.stack { display: flex; flex-direction: column; gap: 52px; padding-block: 26px 8px; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 400; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.sec-title { font-family: var(--display); font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -.015em; margin: 0; }
.sec-lede { font-size: 15px; color: var(--muted); margin: -10px 0 18px; max-width: 34ch; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
p { margin: 0; }

/* photographs */
.art { position: relative; overflow: hidden; background: var(--placeholder); isolation: isolate; width: 100%; max-width: 100%; aspect-ratio: 1; }
.art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
/* product photos sit on a warm ivory mat and are printed onto it (multiply): white studio backdrops turn to cream, nothing stays stark white */
.works .art, .best-card .art, .strip .art, .req .art, .gallery .art, .photos .art, .mat .art, .row > div > .art { background: #f2e8d8; }
.works .art img, .best-card .art img, .strip .art img, .req .art img, .gallery .art img, .photos .art img, .mat .art img, .row > div > .art img { mix-blend-mode: multiply; }
.art .cap { position: absolute; inset: auto 0 0 0; z-index: 1; font-size: 12px; color: var(--on-image); padding: 20px 12px 9px; background: linear-gradient(transparent, rgba(0,0,0,.6)); }

/* swipeable carousels (scroll-snap) */
.carwrap { position: relative; }
.car { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.car::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; }
.dots { display: flex; gap: 0; justify-content: center; }
.dots button { width: 34px; height: 24px; border: 0; padding: 0; background: none; position: relative; }
.dots button::before { content: ""; position: absolute; inset-inline: 6px; top: 11px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.95); opacity: .4; transform: scaleX(.45); box-shadow: 0 0 6px rgba(0,0,0,.25); }
.dots button[aria-current="true"]::before { opacity: 1; transform: scaleX(1); }
.carwrap > .dots { position: absolute; inset: auto 0 16px 0; z-index: 2; }

.hero { position: relative; }
.hero .art { aspect-ratio: 3 / 4; max-height: min(700px, 86vh); }
.hero .credit { position: absolute; top: 18px; inset-inline-start: var(--gl); z-index: 1; font-size: 12.5px; color: rgba(255,255,255,.9); text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.hero .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(30,20,13,.86) 0%, rgba(30,20,13,.42) 38%, rgba(30,20,13,0) 66%), linear-gradient(to bottom, rgba(30,20,13,.38), rgba(30,20,13,0) 18%); }
.hero .copy { position: absolute; inset: auto 0 0 0; color: var(--on-image); padding-block: 32px 30px; display: flex; flex-direction: column; gap: 16px; pointer-events: none; }
.hero .copy button { pointer-events: auto; }
.hero .eyebrow { color: rgba(255,255,255,.8); }
.hero h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 10.2vw, 50px); line-height: 1.08; letter-spacing: -.015em; margin: 0; text-wrap: initial; }
.hero h1 .ln { display: block; white-space: nowrap; }
.hero h1 .ln + .ln { color: #e6c98f; } /* brass-lit second line */
.hero h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.hero h1 .w > span { display: inline-block; }
.hero p { font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.9); max-width: 31ch; }
.hero .dots { justify-content: flex-start; margin-top: 4px; margin-inline-start: -6px; }

.btn { border: 0; border-radius: 999px; padding: 15px 28px; font-weight: 500; font-size: 15.5px; letter-spacing: .01em; --mx: 0px; --my: 0px; translate: var(--mx) var(--my); background: var(--action); color: var(--on-action); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.on-image { background: var(--paper); color: var(--on-image-ink); align-self: flex-start; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn.block { width: 100%; }
.btn.small { padding: 9px 16px; font-size: 14px; }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }

.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; height: 52px; padding-inline: 18px; }
.search:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.search svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; flex: none; }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; height: 100%; font-size: 16px; }
/* on home the search box is a door: tapping it opens the search screen, so nothing on home ever moves while typing */
.search-entry { width: 100%; color: #766555; font-size: 16px; text-align: start; }
.search-entry span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* search screen */
.top .sq { flex: 1; min-width: 0; height: 50px; padding-inline: 16px; }
.top .sq input { font-size: 18px; }
.top .sq input::-webkit-search-decoration, .top .sq input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.sq-clear { width: 32px; height: 32px; margin-inline-end: -8px; border: 0; border-radius: 50%; background: var(--stone); color: var(--ink); display: grid; place-items: center; padding: 0; flex: none; }
.sq-clear svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.sq-body { gap: 30px; padding-top: 14px; }
.sq-status:empty { display: none; }
.sgroup { display: flex; flex-direction: column; }
.sgroup > .sub-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
.sgroup > .sub-title .n { font-family: var(--body); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sgroup .rank-row:first-child, .sgroup .req:first-child { padding-top: 4px; }
.sgroup .works { gap: 26px 14px; }
.sgroup .snip { font-size: 13.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .chip { padding: 8px 15px; font-size: 14.5px; font-weight: 400; }
.s-empty { display: flex; flex-direction: column; gap: 16px; padding: 22px 20px; background: var(--stone); border-radius: var(--r-panel); }
.s-empty .say { font-family: var(--display); font-size: 25px; line-height: 1.25; margin: 0; }
.s-empty .btn { align-self: stretch; white-space: normal; text-align: center; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding-inline: 1px; box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 40%, transparent); }
.maker mark, .banner mark { background: none; box-shadow: none; }

.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; padding-left: var(--gl); padding-right: var(--gr); scroll-padding-inline: var(--gr); }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.mat { flex: none; width: 88px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; text-align: start; }
.mat .art { aspect-ratio: 3 / 4; border-radius: var(--r-img); }
.mat .all { aspect-ratio: 3 / 4; border-radius: var(--r-img); display: grid; place-items: center; font-family: var(--display); font-weight: 500; font-size: 24px; background: var(--sand); }
.mat span.n { font-size: 14px; color: var(--muted); align-self: flex-start; padding: 1px 10px; margin-inline-start: -2px; border-radius: 99px; }
.mat[aria-pressed="true"] span.n { color: var(--on-accent); background: var(--accent); font-weight: 600; }
.mat[aria-pressed="true"] .art, .mat[aria-pressed="true"] .all { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--accent); }

/* works: 2-column grid with full-width feature cards */
.works { display: grid; grid-template-columns: 1fr 1fr; gap: 34px 14px; }
.work { position: relative; min-width: 0; }
.work.feature { grid-column: 1 / -1; }
.work-open { display: flex; flex-direction: column; gap: 10px; background: none; border: 0; padding: 0; text-align: start; width: 100%; }
.work .art { border-radius: var(--r-img); aspect-ratio: 4 / 5; }
/* every fifth work runs edge to edge, like a plate in a catalogue */
.work.feature { margin-inline: calc(-1 * var(--gl)) calc(-1 * var(--gr)); }
.work.feature .art { aspect-ratio: 4 / 5; border-radius: 0; }
.work.feature .label { padding-inline: var(--gl) var(--gr); }
.work.feature .heart { inset-inline-end: var(--gr); top: 14px; }
.work.feature .label .t { font-family: var(--display); font-weight: 400; font-size: 29px; line-height: 1.1; letter-spacing: -.01em; }
.label { display: flex; flex-direction: column; gap: 1px; }
.label .t { font-weight: 500; font-size: 15.5px; line-height: 1.3; }
.label .m { font-size: 13px; color: var(--muted); }
.price { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 14.5px; }
.heart { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; background: rgba(250,245,236,.94); box-shadow: 0 2px 12px rgba(34,24,16,.14); }
.heart svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.5; stroke-linejoin: round; }
.heart[aria-pressed="true"] svg { fill: var(--heart); stroke: var(--heart); }

.maker { flex: none; width: min(72vw, 286px); aspect-ratio: 3 / 4; position: relative; border-radius: var(--r-img); overflow: hidden; border: 0; padding: 0; text-align: start; color: var(--on-image); }
.maker .art { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; }
.maker .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(30,20,13,.8), rgba(30,20,13,0) 58%); }
.maker .info { position: absolute; inset: auto 0 0 0; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.maker .nm { font-family: var(--display); font-size: 31px; line-height: 1.02; }
.maker .sm { font-size: 13px; opacity: .9; }
.stars { font-variant-numeric: tabular-nums; font-size: 13px; }
.best-card { flex: none; width: 164px; display: flex; flex-direction: column; gap: 10px; background: none; border: 0; padding: 0; text-align: start; }
.best-card .art { aspect-ratio: 4 / 5; border-radius: var(--r-img); }
.best-card .craft { font-family: var(--display); font-size: 25px; line-height: 1; }

.band { position: relative; }
.band .art { aspect-ratio: 4 / 5; max-height: 78vh; }
.band .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(30,20,13,.82), rgba(30,20,13,0) 60%); }
.band .copy { position: absolute; inset: auto 0 0 0; padding-block: 30px; color: var(--on-image); display: flex; flex-direction: column; gap: 8px; }
.band q { font-family: var(--display); font-size: 33px; line-height: 1.12; letter-spacing: -.01em; quotes: "״" "״"; display: block; max-width: 13em; text-wrap: balance; }

/* ranked list of makers (also used for maker search results) */
.rank { display: flex; flex-direction: column; }
.rank-row { padding-block: 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.rank-main { display: flex; align-items: center; gap: 12px; border: 0; background: none; width: 100%; text-align: start; padding: 0; }
.rank-row .num { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--accent); width: 26px; flex: none; text-align: center; font-variant-numeric: tabular-nums; }
.rank-row .av { width: 60px; height: 72px; border-radius: var(--r-img); }
.rank-row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rank-row .nm { font-family: var(--display); font-size: 23px; line-height: 1.05; }
.rank-row .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-row .sub .stars { color: var(--ink); font-weight: 600; }
.rank-links { display: flex; gap: 8px; flex-wrap: wrap; padding-inline-start: 110px; }
.rank-row.nonum .rank-links { padding-inline-start: 72px; }
.chip { border: 1px solid transparent; background: var(--stone); border-radius: 999px; padding: 5px 13px; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.sub-title { font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.1; margin: 0 0 4px; }
.found + .sub-title { margin-top: 26px; }

.how { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.how li { display: grid; grid-template-columns: 48px 1fr; gap: 6px; padding: 16px 18px 16px 12px; background: var(--stone); border-radius: var(--r-panel); }
/* the one dark field on the home screen: how a commission happens */
.how-field { background: var(--field); color: var(--on-field); padding-block: 60px 64px; }
.how-field .sec-title { color: var(--on-field); font-size: 40px; margin-bottom: 30px; }
.how-field .how { gap: 30px; }
.how-field .how li { background: none; padding: 0; grid-template-columns: 56px 1fr; gap: 10px; border-radius: 0; }
.how-field .how .num { font-weight: 500; font-size: 52px; color: var(--field-num); text-align: start; line-height: .9; }
.how-field .how b { font-family: var(--display); font-weight: 500; font-size: 25px; line-height: 1.15; margin-bottom: 4px; }
.how-field .how .muted { color: var(--field-muted); font-size: 15px; }
.how-field .btn { margin-top: 38px; background: var(--on-field); color: var(--field); }
.how .num { font-family: var(--display); font-size: 34px; line-height: 1; color: var(--accent); text-align: center; }
.how b { display: block; font-weight: 600; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.tag.solid { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.tag svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }

.display { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.04; letter-spacing: -.01em; margin: 0; }
.specs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin: 0; }
.specs div { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
.specs div:nth-child(odd) { padding-inline-end: 12px; }
.specs dt { font-size: 13px; color: var(--muted); }
.specs dd { margin: 0; font-weight: 500; }
/* a single fact: one row, label and value on the same line */
.specs.one { grid-template-columns: 1fr; }
.specs.one div { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline-end: 0; }
.specs.one dd { text-align: end; }
.big-price { font-family: var(--display); font-size: 32px; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.maker-line { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: start; }
.av { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; flex: none; position: relative; }
.av .art { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; }
.av .ini { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-image); font-family: var(--display); font-size: 19px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

.gallery .art { aspect-ratio: 4 / 5; max-height: 74vh; }
.gallery .heart { top: 14px; inset-inline-end: var(--gr); }
.gallery .count { position: absolute; top: 16px; inset-inline-start: var(--gl); z-index: 2; font-size: 12px; color: #fff; background: rgba(34,24,16,.4); padding: 3px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }

.req { display: flex; gap: 14px; padding-block: 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; width: 100%; padding-inline: 0; align-items: flex-start; }
.req .art { width: 92px; flex: none; border-radius: var(--r-img); aspect-ratio: 4 / 5; }
.req .info { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
.req .t { font-weight: 500; font-size: 16.5px; line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--stone); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: none; padding: 9px; font-weight: 500; color: var(--muted); border-radius: 999px; }
.seg button[aria-pressed="true"] { color: var(--paper); background: var(--ink); font-weight: 600; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-left: var(--gl); padding-right: var(--gr); }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid transparent; background: var(--stone); border-radius: 999px; padding: 6px 15px; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.offer { border: 0; border-radius: var(--r-panel); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
/* offers on a request: every card looks the same, no ranking implied */
.offer-card { border: 0; border-radius: var(--r-panel); padding: 18px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); width: 100%; text-align: start; color: inherit; }
.offer-card .who { display: flex; align-items: center; gap: 12px; }
.offer-card .who .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.offer-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 10px; }
.offer-card .foot .go { color: var(--accent); font-weight: 600; white-space: nowrap; }
.udot { width: 10px; height: 10px; border-radius: 50%; background: var(--heart); flex: none; }
.onums { display: flex; gap: 22px; }
.onums > span { display: flex; flex-direction: column; }
.onums .k { font-size: 12.5px; color: var(--muted); }
.onums .v { font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.offer-full { display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--surface); border: 0; border-radius: var(--r-panel); }
.offer-full .otitle { font-family: var(--display); font-size: 22px; line-height: 1.2; }
.offer-full .strip { margin-top: 2px; }
.offer-full .strip .work-open { gap: 0; }
.thread-sep { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.thread-sep::before, .thread-sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.nums { display: flex; gap: 22px; }
.nums div { display: flex; flex-direction: column; }
.nums span { font-size: 12.5px; color: var(--muted); }
.nums strong { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }

form.f { display: flex; flex-direction: column; gap: 26px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field .lbl { font-weight: 600; font-size: 15px; }
.hint { font-size: 13px; color: var(--muted); }
.input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 9px 0; width: 100%; min-width: 0; outline: none; font-size: 16px; }
.input:focus { border-color: var(--accent); }
textarea.input { min-height: 96px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; }
.pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.pick span { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 999px; padding: 8px 17px; font-size: 14.5px; background: var(--stone); }
.pick input:checked + span { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; }
.opt .grow { flex: 1; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos .art { width: 68px; border-radius: var(--r-img); }
.add-photo { width: 68px; height: 68px; border-radius: var(--r-img); border: 1px dashed var(--muted); background: none; color: var(--muted); font-size: 24px; }

.story { font-family: var(--display); font-size: 25px; line-height: 1.42; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--field); color: var(--on-field); border-radius: var(--r-panel); padding: 6px 16px; }
.stats div { padding: 12px 0; display: flex; flex-direction: column; }
.stats strong { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12.5px; color: var(--field-muted); }
.stats strong { color: var(--on-field); }
.stats div:first-child strong { color: var(--field-num); }
.stats.four { grid-template-columns: repeat(4, 1fr); }
.stats.four div { min-width: 0; padding-inline-end: 6px; }
.stats.four strong { font-size: 23px; white-space: nowrap; }
.banner { position: relative; }
.banner .art { aspect-ratio: 4 / 5; max-height: 72vh; }
.banner .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(30,20,13,.8), rgba(30,20,13,0) 58%); }
.banner .copy { position: absolute; inset: auto 0 0 0; padding-block: 22px; color: var(--on-image); display: flex; flex-direction: column; gap: 6px; }
.banner h2 { font-family: var(--display); font-weight: 400; font-size: 50px; line-height: .98; letter-spacing: -.015em; margin: 0; }
.banner .where { font-size: 15px; color: rgba(255,255,255,.88); margin-bottom: 6px; }
.banner .tag { color: var(--on-image); border-color: rgba(255,255,255,.45); }
.ptabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 18; display: flex; gap: 6px; padding-block: 8px; background: var(--paper); margin-block: -8px; }
.ptabs button { flex: 1; border: 1px solid transparent; background: var(--stone); border-radius: 999px; padding: 8px 6px; font-size: 14.5px; font-weight: 500; }
.ptabs button[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
[id^="sec-"] { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 122px); }
.tab-pad { flex: none; margin-top: -52px; }
.review { padding: 18px 20px; background: var(--surface); border: 0; border-radius: var(--r-panel); display: flex; flex-direction: column; gap: 6px; }
.reviews { display: flex; flex-direction: column; gap: 10px; }
.review q { font-family: var(--display); font-size: 21px; line-height: 1.38; quotes: "״" "״"; }
.review .st { color: var(--accent); letter-spacing: .1em; font-size: 13px; }

.chat-list .item { display: flex; gap: 14px; align-items: center; padding-block: 14px; border: 0; border-bottom: 1px solid var(--line); width: 100%; background: none; text-align: start; padding-inline: 0; }
.chat-list .item .info { flex: 1; min-width: 0; }
.chat-list .last { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-list .item .av .ini.solo { background: var(--accent); }
.chat-list .about { font-size: 12.5px; color: var(--accent); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bubbles { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 80%; padding: 10px 15px; border-radius: 20px; font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.bubble.them { background: var(--surface); border: 0; align-self: flex-end; border-end-end-radius: 6px; }
.bubble.me { background: var(--accent); color: var(--on-accent); align-self: flex-start; border-end-start-radius: 6px; }
/* chat screen: one column exactly the size of the visible screen (above the keyboard).
   header on top, the messages scroll on their own, composer at the bottom. The page itself never scrolls here. */
.chat-shell { position: fixed; z-index: 15; left: 0; right: 0; margin-inline: auto; width: min(440px, 100%);
  top: var(--vvt, 0px); height: var(--vvh, 100vh); display: flex; flex-direction: column; background: var(--paper); padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 480px) { .chat-shell { border-inline: 1px solid var(--line); } }
.chat-shell > .top { position: relative; top: 0; flex: none; border-bottom: 1px solid var(--line); }
.thread-wrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 16px; padding-block: 14px 16px; }
.thread.plain .bubbles { margin-top: auto; }
.newpill { position: absolute; z-index: 3; bottom: 12px; inset-inline: 0; margin-inline: auto; width: max-content; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); padding: 8px 18px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 18px rgba(43,31,23,.22); }
.choose-bar { flex: none; padding-top: 10px; border-top: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; gap: 4px; }
.kb-open .choose-bar { display: none; }
.composer { flex: none; display: flex; gap: 8px; padding: 6px; padding-inline-start: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 8px 28px rgba(43,31,23,.10);
  margin: 10px var(--gr) max(12px, calc(env(safe-area-inset-bottom, 0px) + 6px)) var(--gl); }
.composer input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
.kb-open .composer { margin-bottom: 8px; }
.chat-mode .nav { display: none; }
body.chat-mode { overflow: hidden; }
.chat-mode .app { min-height: 0; padding-bottom: 0; }

/* bottom sheet (rejecting a maker, confirming an offer); sized to the visible screen so the keyboard never covers it */
.sheet { position: fixed; z-index: 50; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100vh); display: flex; flex-direction: column; justify-content: flex-end; }
.sheet[hidden] { display: none; }
.sheet-back { position: absolute; inset: 0; background: rgba(34,24,16,.45); }
.sheet-panel { position: relative; width: min(440px, 100%); margin-inline: auto; max-height: calc(100% - 16px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  padding: 8px var(--gr) max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px)) var(--gl); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
.sheet-panel h2:focus { outline: none; }
.sheet-body { display: flex; flex-direction: column; gap: 18px; }
body.sheet-open { overflow: hidden; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 2px; }
.to-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 12px 14px; background: var(--stone); border-radius: 8px; }
.to-line .em { font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
.opt .em { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; text-align: end; }
.qs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
textarea.input.big { min-height: 150px; }
.btn:disabled { background: var(--placeholder); color: var(--muted); cursor: not-allowed; }
.btn.warnbtn:not(:disabled) { background: var(--warn); }
.done-tag { white-space: normal; align-self: flex-start; line-height: 1.4; }
.sent summary { list-style: none; cursor: pointer; display: inline-block; }
.sent summary::-webkit-details-marker { display: none; }
.sent .c, .sent[open] .o { display: none; }
.sent[open] .c { display: inline; }
.sent-box { margin-top: 10px; padding: 12px 14px; background: var(--surface); border: 0; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
.sent-box .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.note { border-inline-start: 2px solid var(--accent); padding: 2px 12px; font-size: 13.5px; color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 26px 1fr; gap: 14px; position: relative; padding-bottom: 22px; }
.step:not(:last-child)::before { content: ""; position: absolute; inset-inline-start: 12px; top: 28px; bottom: 2px; width: 1px; background: var(--line); }
.step.done:not(:last-child)::before { background: var(--accent); }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step.done .dot { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step.now .dot { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.dot svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.6; }
.step .st { font-weight: 600; }
.step .sd { font-size: 13.5px; color: var(--muted); }
.progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.strip { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.strip .art { border-radius: var(--r-img); aspect-ratio: 4 / 5; }
.rate { display: flex; gap: 6px; margin-top: 10px; }
.rate button { border: 0; background: var(--stone); border-radius: 50%; width: 44px; height: 44px; font-size: 14px; color: var(--accent); }

.panel { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }

.nav { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); width: min(416px, calc(100% - 24px)); height: var(--nav-h); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; box-shadow: 0 12px 34px rgba(43,31,23,.12); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; font-size: 11px; color: var(--muted); position: relative; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.nav .plus .c { --mx: 0px; --my: 0px; translate: var(--mx) var(--my); width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; margin-top: -2px; }
.nav .plus .c svg { width: 20px; height: 20px; stroke-width: 2; }
.badge { position: absolute; top: 5px; inset-inline-end: calc(50% - 20px); background: var(--heart); color: var(--on-image); font-size: 10.5px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
/* keyboard open: the tab bar steps aside instead of riding up with the keyboard */
.kb-open .nav { opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-50%, 24px); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(16px); background: var(--ink); color: var(--paper); padding: 11px 20px; border-radius: 999px; font-weight: 500; font-size: 14.5px; opacity: 0; pointer-events: none; z-index: 40; width: max-content; max-width: calc(100% - 32px); text-align: center; }
.chat-mode .toast, .kb-open .toast { bottom: calc(var(--composer-h) + var(--kb) + 30px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty { text-align: center; color: var(--muted); padding: 28px 10px; }

/* ---------- motion: only for people who haven't asked for less ----------
   The house moves slowly and surely: long eased arrivals, no bounce. Everything is fully visible at rest;
   GSAP (loaded from cdnjs) adds the hero reveal, the drifting photographs, scroll reveals and counters on top. */
@media (prefers-reduced-motion: no-preference) {
  .car { scroll-behavior: smooth; }
  button { transition: transform .55s var(--ease), background-color .3s, color .3s, box-shadow .3s, border-color .3s; }
  button:active { transform: scale(.97); transition-duration: .14s; }
  .rank-main:active, .req:active, .chat-list .item:active, .work-open:active, .offer-card:active { transform: scale(.985); }
  /* photographs lean in slowly when touched */
  .work-open .art img, .maker .art img, .best-card .art img, .mat .art img { transition: transform 1.4s var(--ease); }
  .work-open:active .art img, .maker:active .art img, .best-card:active .art img, .mat:active .art img { transform: scale(1.045); }
  @media (hover: hover) {
    .work-open:hover .art img, .maker:hover .art img, .best-card:hover .art img { transform: scale(1.035); }
    .btn:hover { background: color-mix(in srgb, var(--action) 82%, var(--accent)); }
    .btn.on-image:hover { background: var(--surface); }
    .link:hover { text-decoration-color: currentColor; }
  }
  .link { transition: text-decoration-color .3s; }
  /* screens cross-fade with a short, soft travel */
  #view.in-fwd, .chat-shell.in-fwd { animation: inFwd .6s var(--ease); }
  #view.in-back, .chat-shell.in-back { animation: inBack .6s var(--ease); }
  #view.in-fade, .chat-shell.in-fade { animation: inFade .55s var(--ease); }
  @keyframes inFwd { from { transform: translateX(-16px); opacity: 0; } }
  @keyframes inBack { from { transform: translateX(16px); opacity: 0; } }
  @keyframes inFade { from { transform: translateY(8px); opacity: 0; } }
  .sheet-back { transition: opacity .45s var(--ease); }
  .sheet-panel { transition: transform .6s var(--ease); }
  .sheet:not(.on) .sheet-back { opacity: 0; }
  .sheet:not(.on) .sheet-panel { transform: translateY(100%); }
  .newpill { animation: inFade .4s var(--ease); }
  .heart.pop svg { animation: pop .7s var(--ease); }
  @keyframes pop { 0% { transform: scale(.8); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .bubble.new { animation: bubIn .45s var(--ease); }
  @keyframes bubIn { from { transform: translateY(10px); opacity: 0; } }
  .dots button::before { transition: transform .8s var(--ease), opacity .8s var(--ease); }
  .hero .art img, .band .art img, .banner .art img { will-change: transform; }
  .nav { transition: opacity .3s, transform .45s var(--ease), visibility 0s; }
  .kb-open .nav { transition: opacity .15s, transform .2s, visibility 0s linear .2s; }
  .toast { transition: opacity .35s var(--ease), transform .45s var(--ease); }
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<div class="app" dir="rtl" lang="he">
  <div class="demo-note g">גרסת הדגמה · שמות ומחירים לדוגמה · צילומים חינמיים מ-Unsplash</div>
  <main id="view"></main>
  <nav class="nav" id="nav" aria-label="ניווט ראשי"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden></div>
</div>

const UI = {

  chat: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/>', box: '<path d="M4 8l8-4 8 4v9l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v9"/>',

/* ---------- conversations: plain chats ("c:<maker>") and offer threads ("o:<request>|<offer index>") ---------- */
const offerAt = v => { const [rid, i] = v.split('|'), r = S.requests.find(x => x.id === rid); return { r, o: r.offers[+i], i: +i }; };
/* who is looking at this offer's thread: the buyer who posted it, the maker who sent it, or nobody (it is private) */
const sideFor = (r, o) => S.role === 'buyer' && r.mine ? 'buyer' : S.role === 'maker' && o.maker === 'me' ? 'maker' : null;
const threadOf = key => key.startsWith('o:') ? offerAt(key.slice(2)).o.thread : (S.chats[key.slice(2)] = S.chats[key.slice(2)] || []);

const unreadOf = (r, o) => { const side = sideFor(r, o), th = o.thread, last = th[th.length - 1]; return !!(side && last && last.by !== side && th.length > (o.seen || 0)); };

    <div class="stack g">
      <div style="display:flex;flex-direction:column;gap:12px"><h2 class="display">${it.title}</h2><span class="muted">${CRAFTS[it.craft]} · מאת ${MAKERS[it.maker].name}</span><span class="big-price">${ils(it.price)}</span></div>
      <dl class="specs"><div><dt>חומר</dt><dd>${it.mat}</dd></div><div><dt>מידות</dt><dd>${it.size}</dd></div><div><dt>זמן הכנה</dt><dd>${it.days}</dd></div><div><dt>יוצר</dt><dd>${MAKERS[it.maker].name}</dd></div></dl>

          <label class="opt"><input type="radio" name="del" id="del-ship" value="משלוח עד הבית"><span class="grow">משלוח עד הבית</span><span>${ils(35)}</span></label></div>
        <div class="field"><label for="wish">בקשה מיוחדת</label><input class="input" id="wish" name="wish" placeholder="למשל: חריטת השם ״נועם״"></div>
        <div class="row"><button class="btn block" type="submit">הזמנה</button><button class="btn ghost block" type="button" data-act="chat" data-v="${it.maker}">שאלה ליוצר</button></div>
      </form>
    </div>`; },

  maker: ({ id }) => { const m = MAKERS[id], items = itemsOf(id), rank = craftRank(id), f = m.g === 'f', revs = REVIEWS[id] || [];
    const tabs = [['works', 'עבודות'], ['reviews', 'ביקורות'], ...(m.story ? [['story', 'הסיפור']] : [])];
    return `${head('')}<section class="banner pfx">${art(m.img)}<div class="shade"></div>
      <div class="copy g"><h2>${m.name}</h2><span class="where">${CRAFTS[m.craft]} · ${m.city}</span>
      <span class="tags">${m.verified ? `<span class="tag">${svg(UI.check)} עבודת יד מאומתת</span>` : `<span class="tag">${f ? 'יוצרת חדשה' : 'יוצר חדש'}</span>`}</span></div></section>
    <div class="stack g">
      <div class="stats four"><div><strong>★ ${m.rating.toFixed(1)}</strong><span>דירוג</span></div><div><strong data-count="${m.orders}">${m.orders}</strong><span>הזמנות</span></div>
        <div><strong>${rank ? `#${rank}` : '—'}</strong><span>${rank ? `בדירוג ה${CRAFTS[m.craft]}` : 'עוד בלי דירוג'}</span></div><div><strong>${m.since}</strong><span>${f ? 'יוצרת' : 'יוצר'} מאז</span></div></div>
      <nav class="ptabs bleed g" aria-label="קפיצה בתוך הפרופיל">${tabs.map(([k, l], i) => `<button data-act="jump" data-v="${k}" ${i ? '' : 'aria-current="true"'}>${l}${k === 'works' ? ` (${items.length})` : k === 'reviews' ? ` (${revs.length})` : ''}</button>`).join('')}</nav>
      <section id="sec-works"><div class="sec-head"><h2 class="sec-title">עבודות</h2></div>${items.length ? worksGrid(items) : `<p class="muted">עוד אין עבודות בגלריה של ${m.name}. אפשר לשלוח בקשה אישית בכפתור שלמטה.</p>`}</section>
      <section id="sec-reviews"><div class="sec-head"><h2 class="sec-title">ביקורות</h2><span class="small muted">★ ${m.rating.toFixed(1)} · ${m.orders} הזמנות</span></div>
        ${revs.length ? `<div class="reviews">${revs.map(r => `<div class="review"><span class="st" aria-label="${r.s} כוכבים">${'★'.repeat(r.s)}${'☆'.repeat(5 - r.s)}</span><q>${esc(r.t)}</q><span class="small muted">${esc(r.w)} · הזמנה ששולמה באפליקציה</span></div>`).join('')}</div>`
          : `<p class="muted">עוד אין ביקורות. הן יופיעו כאן אחרי ההזמנה הראשונה.</p>`}</section>
      ${m.story ? `<section id="sec-story"><div class="sec-head"><h2 class="sec-title">הסיפור</h2></div><p class="story">${m.story}</p></section>` : ''}
      ${rank ? `<button class="link" style="align-self:flex-start" data-act="makers" data-v="${m.craft}">לדירוג היוצרים ב${CRAFTS[m.craft]}</button>` : ''}
      <button class="btn block" data-act="direct" data-v="${id}">בקשה אישית מ${m.name.split(' ')[0]}</button>
      <div class="tab-pad" aria-hidden="true"></div>
    </div>`; },

  search: () => `<header class="top g">${S.stack.length > 1 ? `<button class="round" data-act="back" aria-label="חזרה">${svg(UI.back)}</button>` : ''}
      <form class="search sq" data-form="search" role="search">${svg(UI.search)}<input id="sq" name="q" type="search" value="${esc(S.sq)}" placeholder="מה תרצו? ארנק, ספל, טבעת..." aria-label="חיפוש בעבודות, ביוצרים ובבקשות" aria-describedby="sq-status" aria-controls="sq-results" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button type="button" class="sq-clear" data-act="sqclear" aria-label="ניקוי החיפוש" ${S.sq ? '' : 'hidden'}>${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button></form></header>
    <div class="stack g sq-body"><p class="small muted sq-status" id="sq-status" role="status" aria-live="polite">${esc(searchStatus())}</p><div id="sq-results" class="stack" style="padding:0">${searchHTML()}</div></div>`,

  makers: () => { const list = ranked(S.makersCraft);
    return `${head('היוצרים')}
    <div class="stack g" style="gap:18px">
      <p class="muted">${S.makersCraft === 'all' ? 'כל היוצרים באפליקציה, לפי הדירוג ומספר ההזמנות.' : `היוצרים ב${CRAFTS[S.makersCraft]}, לפי הדירוג ומספר ההזמנות.`}</p>
      ${filters('mcraft', S.makersCraft)}
      <p class="small muted">הסדר נקבע לפי הציון הממוצע ומספר ההזמנות שהושלמו</p>
      <div class="rank">${list.map((id, i) => makerRow(id, i + 1)).join('')}</div>
    </div>`; },

  board: () => { const list = S.requests.filter(r => (S.boardCraft === 'all' || r.crafts.includes(S.boardCraft)) && (S.boardTab === 'all' || r.mine));
    return `${head('לוח בקשות')}
    <div class="stack g" style="gap:18px">
      <p class="muted">קונים מתארים מה הם רוצים, יוצרים שולחים הצעות.${S.role === 'maker' ? ' מצאו בקשה שמתאימה לכם.' : ''}</p>
      <div class="seg"><button data-act="btab" data-v="all" aria-pressed="${S.boardTab === 'all'}">כל הבקשות</button><button data-act="btab" data-v="mine" aria-pressed="${S.boardTab === 'mine'}">הבקשות שלי</button></div>
      ${filters('bcraft', S.boardCraft)}
      <div>${list.length ? list.map(r => `<button class="req" data-act="req" data-v="${r.id}">${art(r.v)}
        <span class="info"><span class="row between">${craftTags(r)}<span class="small muted">${r.ago}</span></span>
        <span class="t">${esc(r.title)}</span>
        <span class="meta"><span>מתי <b>${esc(r.due)}</b></span><span>${r.offers.length ? `<b>${r.offers.length}</b> הצעות` : 'עוד אין הצעות'}</span>${r.closed ? '<span>· נסגרה הזמנה</span>' : ''}${r.to ? `<span>· ישירות ל${MAKERS[r.to].name}</span>` : ''}</span></span></button>`).join('') : '<p class="empty">אין כאן בקשות עדיין.</p>'}</div>
    </div>`; },

  req: ({ id }) => { const r = S.requests.find(x => x.id === id), owner = S.role === 'buyer' && r.mine, picked = r.closed && r.offers[r.picked];
    return `${head('בקשה')}
    <div class="stack g">
      <div class="row" style="align-items:flex-start;gap:14px"><div style="width:104px;flex:none">${art(r.v, '', '')}</div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">${craftTags(r)}<h2 class="display" style="font-size:27px">${esc(r.title)}</h2><span class="small muted">${esc(r.buyer)} · ${esc(r.city)} · ${r.ago}</span></div></div>
      <p>${esc(r.text)}</p>
      <dl class="specs one"><div><dt>מתי</dt><dd>${esc(r.due)}</dd></div></dl>
      <section><div class="sec-head" style="margin-bottom:6px"><h2 class="sec-title">${r.offers.length === 1 ? 'הצעה אחת' : r.offers.length ? `${r.offers.length} הצעות` : 'מחכים להצעות'}</h2></div>
      ${r.offers.length ? `<p class="small muted" style="margin-bottom:14px">${picked ? `נבחרה ההצעה של ${MAKERS[picked.maker].name}. אפשר להמשיך לדבר בתוך ההצעה.` : owner ? 'פתחו הצעה כדי לקרוא אותה ולדבר עם היוצר לפני שבוחרים' : 'לחיצה על הצעה פותחת אותה במלואה.'}</p>` : ''}
      <div style="display:flex;flex-direction:column;gap:12px">${r.offers.map((o, i) => offerCard(r, o, i)).join('')}
      ${!r.offers.length ? '<p class="empty">יוצרים מתאימים קיבלו התראה. בדרך כלל ההצעה הראשונה מגיעה תוך יום.</p>' : ''}</div></section>
      ${S.role === 'maker' && !r.closed ? `<form class="f panel" data-form="offer" data-v="${r.id}"><h2 class="sec-title">שליחת הצעה</h2>
        <div class="row" style="gap:16px"><div class="field" style="flex:1"><label for="o-price">מחיר (₪)</label><input class="input" id="o-price" name="price" inputmode="numeric" value="200" required></div>
        <div class="field" style="flex:1"><label for="o-days">ימי עבודה</label><input class="input" id="o-days" name="days" inputmode="numeric" value="14" required></div></div>
        <div class="field"><label for="o-note">כמה מילים לקונה</label><textarea class="input" id="o-note" name="note">אשמח להכין את זה. אשלח סקיצה לפני שאני מתחיל/ה.</textarea></div>
        <button class="btn" type="submit">שליחת ההצעה</button></form>` : ''}
      ${S.role === 'buyer' && !r.mine ? '<p class="note">זו בקשה של קונה אחר. כדי לראות איך שולחים הצעה, עברו למצב ״יוצר״ במסך החשבון.</p>' : ''}
    </div>`; },

  post: ({ to, title = '', hint } = {}) => { const pre = to ? [MAKERS[to].craft] : hint ? [hint] : [];
    return `${head(to ? `בקשה ל${MAKERS[to].name}` : 'בקשה חדשה')}
    <div class="stack g">
      <p class="muted">${to ? `הבקשה תישלח רק אל ${MAKERS[to].name}, שיחזור אליכם עם הצעת מחיר.` : 'הבקשה תופיע בלוח, ויוצרים מתאימים מכל הארץ ישלחו הצעות.'}</p>
      <form class="f" data-form="post" data-v="${to || ''}">
        <div class="field"><label for="p-title">מה תרצו שיכינו בשבילכם?</label><input class="input" id="p-title" name="title" required placeholder="למשל: קרש חיתוך עם שמות הילדים" autocomplete="off" value="${esc(title)}"></div>
        <div class="field"><span class="lbl">תחום · אפשר לבחור כמה</span>
          <div class="picks">${Object.entries(CRAFTS).map(([k, v]) => `<label class="pick"><input type="checkbox" name="crafts" value="${k}" id="pc-${k}" ${pre.includes(k) ? 'checked' : ''}><span>${v}</span></label>`).join('')}
            <label class="pick"><input type="checkbox" id="pc-other" name="otherOn" value="1"><span>אחר</span></label></div>
          <input class="input" id="p-other" name="other" placeholder="איזה תחום? למשל: זכוכית, טקסטיל, קליעה" hidden>
          <span class="hint">עגילים מעץ? בחרו גם ״תכשיטים״ וגם ״עץ״.</span></div>
        <div class="field"><label for="p-text">פרטים</label><textarea class="input" id="p-text" name="text" placeholder="מידות, צבעים, למי זה מיועד..."></textarea></div>
        <div class="field"><label for="p-due">עד מתי?</label><input class="input" id="p-due" name="due" placeholder="למשל: לפני יום ההולדת, 12.12"></div>
        <div class="field"><span class="lbl">תמונות השראה</span><div class="photos" id="photos"><button type="button" class="add-photo" data-act="addphoto" aria-label="הוספת תמונה">+</button></div><span class="hint">בהדגמה, לחיצה על + מוסיפה תמונה לדוגמה.</span></div>
        <button class="btn block" type="submit">${to ? 'שליחה ליוצר' : 'פרסום בלוח'}</button>
      </form>
    </div>`; },

  /* every conversation in one list: offer conversations (labelled with the request) and direct chats */
  chats: () => { const rows = [];
    S.requests.forEach(r => r.offers.forEach((o, i) => { const side = sideFor(r, o), th = o.thread; if (!side || !th.length) return; const last = th[th.length - 1], un = unreadOf(r, o);
      rows.push(`<button class="item" data-act="offer" data-v="${r.id}|${i}">${side === 'buyer' ? avatar(o.maker) : buyerAv(r.buyer)}<span class="info"><span class="row between" style="gap:8px"><b>${side === 'buyer' ? MAKERS[o.maker].name : esc(r.buyer)}</b><span class="tag">הצעה</span></span>
        <div class="about">על: ${esc(r.title)}</div><div class="last">${last.by === side ? 'את/ה: ' : ''}${esc(last.t)}</div></span>${un ? '<span class="udot" aria-label="הודעה חדשה"></span>' : ''}</button>`); }));
    Object.keys(S.chats).forEach(id => { const m = MAKERS[id], last = S.chats[id][S.chats[id].length - 1];
      rows.push(`<button class="item" data-act="chat" data-v="${id}">${avatar(id)}<span class="info"><b>${m.name}</b><div class="last">${last ? `${last.me ? 'את/ה: ' : ''}${esc(last.t)}` : 'שיחה חדשה'}</div></span></button>`); });
    return `${head('הודעות')}<div class="g chat-list">${rows.join('') || '<p class="empty">עוד אין שיחות.</p>'}</div>`; },

  /* the composer lives inside the chat layout; sending only appends a bubble, it never rebuilds the screen */
  chat: ({ id }) => { const m = MAKERS[id];
    return chatShell({ key: 'c:' + id, title: m.name, plain: true, extra: `<button class="link" data-act="maker" data-v="${id}">לפרופיל</button>`,
      intro: '<p class="note">כשסוגרים הזמנה כאן, המקדמה שמורה והביקורת נספרת בפרופיל.</p>' }); },

  /* one offer: the full offer on top, then the conversation about THIS offer, then "choose" above the composer */
  offer: ({ v }) => { const { r, o } = offerAt(v), m = MAKERS[o.maker], side = sideFor(r, o), first = m.name.split(' ')[0], works = itemsOf(o.maker).slice(0, 2);
    if (side) o.seen = o.thread.length;
    const canChoose = side === 'buyer' && !r.closed, isPicked = r.closed && r.offers[r.picked] === o;
    const intro = `<div class="offer-full">
        <p class="otitle">${esc(r.title)}</p>
        ${makerLine(o.maker)}
        <div class="onums"><span><span class="k">מחיר</span><span class="v">${ils(o.price)}</span></span><span><span class="k">זמן הכנה</span><span class="v">${o.days} ימים</span></span></div>
        <p>${esc(o.note)}</p>
        ${works.length ? `<div class="strip">${works.map(it => `<button class="work-open" data-act="item" data-v="${it.id}" aria-label="${it.title}">${art(it.v, '', it.title)}</button>`).join('')}</div>` : ''}
        ${isPicked ? '<span class="tag solid" style="align-self:flex-start">ההצעה שבחרתם</span>' : ''}</div>
      <div class="thread-sep">${side === 'buyer' ? `השיחה שלכם עם ${first}` : side === 'maker' ? `השיחה עם ${esc(r.buyer)}` : 'השיחה פרטית'}</div>
      ${side ? '' : `<p class="note">השיחה על ההצעה הזאת פרטית, בין ${esc(r.buyer)} ל${m.name}. בבקשות שלכם אפשר לדבר כאן עם כל יוצר לפני שבוחרים.</p>`}`;
    const foot = canChoose ? `<div class="choose-bar g"><button class="btn block" data-act="pickoffer" data-v="${v}">בחירת ההצעה הזאת</button></div>`
      : side === 'buyer' && r.closed ? `<div class="choose-bar g"><p class="small muted" style="padding-bottom:2px">${isPicked ? 'בחרתם את ההצעה הזאת. ההזמנה מופיעה בלשונית ״הזמנות״.' : 'כבר נבחרה הצעה אחרת לבקשה הזאת.'}</p></div>` : '';
    return chatShell({ key: 'o:' + v, title: side === 'maker' ? 'ההצעה שלך' : `ההצעה של ${first}`, intro, foot, canWrite: !!side,
      empty: side === 'buyer' ? `אפשר לשאול את ${first} כל דבר לפני שבוחרים: צבע, מידה, זמנים.` : 'אפשר לכתוב לקונה כאן, למשל שאלה על צבע או מידה.' }); },

  orders: () => `${head('הזמנות')}<div class="g">${S.orders.map(o => `<button class="req" data-act="order" data-v="${o.id}">${art(o.v)}
      <span class="info"><span class="t">${esc(o.title)}</span><span class="small muted">${MAKERS[o.maker].name} · ${ils(o.price)}</span>
      <span class="small"><b>${o.stage >= STAGES.length ? 'הושלמה' : STAGES[o.stage][0]}</b></span>
      <span class="progress" aria-hidden="true"><i style="width:${Math.min(100, o.stage / STAGES.length * 100)}%"></i></span></span></button>`).join('')}</div>`,

  order: ({ id }) => { const o = S.orders.find(x => x.id === id);
    return `${head('מעקב הזמנה')}
    <div class="stack g">
      <div class="row" style="gap:14px"><div style="width:92px;flex:none">${art(o.v)}</div><div style="min-width:0"><h2 class="display" style="font-size:26px">${esc(o.title)}</h2><span class="small muted">${MAKERS[o.maker].name} · ${ils(o.price)} · ${esc(o.delivery)}</span></div></div>
      ${makerLine(o.maker)}
      <ol class="steps">${STAGES.map(([t, d], i) => { const st = i < o.stage ? 'done' : i === o.stage ? 'now' : ''; let x = '';
        if (i === 1) x = `<p class="note" style="margin-top:6px">בתקופת ההשקה משלמים ישירות ליוצר (ביט / פייבוקס). בהמשך האפליקציה תשמור את המקדמה.</p>`;
        if (i === 2 && o.photos.length && o.stage >= 2) x = `<div class="strip">${o.photos.map(([c, v]) => art(v, '', c)).join('')}</div>`;
        if (i === 5 && o.stage === 5) x = `<div class="rate" role="group" aria-label="דירוג">${[1, 2, 3, 4, 5].map(n => `<button data-act="rate" data-v="${o.id}|${n}" aria-label="${n} כוכבים">${n}★</button>`).join('')}</div>`;
        if (i === 5 && o.stage > 5) x = `<p class="small">דירגתם ${o.rating} כוכבים. תודה!</p>`;
        return `<li class="step ${st}"><span class="dot">${st === 'done' ? svg(UI.check) : i + 1}</span><div><div class="st">${t}</div>${d ? `<div class="sd">${d}</div>` : ''}${x}</div></li>`; }).join('')}</ol>
      ${o.stage < 5 ? `<button class="btn ghost block" data-act="advance" data-v="${o.id}">קידום לשלב הבא (רק בהדגמה)</button>` : ''}
      <button class="btn block" data-act="chat" data-v="${o.maker}">צ׳אט עם ${MAKERS[o.maker].name}</button>
    </div>`; },

  profile: () => { const waiting = S.pending.filter(p => p.status === 'pending').length, saved = ITEMS.filter(i => S.saved.has(i.id));
    return `${head('החשבון שלי')}
    <div class="stack g">
      <section style="display:flex;flex-direction:column;gap:10px"><span class="lbl" style="font-weight:600">איך משתמשים באפליקציה עכשיו?</span>
        <div class="seg"><button data-act="role" data-v="buyer" aria-pressed="${S.role === 'buyer'}">אני קונה</button><button data-act="role" data-v="maker" aria-pressed="${S.role === 'maker'}">אני יוצר/ת</button></div>

   Everything is fully visible without this block. It only runs when GSAP loaded and the person hasn't asked for less motion.
   - the hero headline rises word by word out of its own mask, then the sentence and the button follow (first visit only)
   - the hero photographs drift slowly (paused when the hero is off screen) and sink a little as you scroll past
   - large photographs (the quote band, a maker's portrait) move at a slightly different pace than the page
   - cards and headings below the fold rise softly into place as they arrive, a few at a time
   - a maker's order count counts up once
   - on a mouse, the main buttons lean gently toward the pointer */
const GS = window.gsap && window.ScrollTrigger ? window.gsap : null;
if (GS) { gsap.registerPlugin(ScrollTrigger); ScrollTrigger.config({ ignoreMobileResize: true }); }
let MM = null, WORKS_ST = [];
/* the works list (#works) keeps its own reveal triggers, so it can be redrawn alone without touching the rest of the screen */
const killWorksST = () => { WORKS_ST.forEach(t => t.kill()); WORKS_ST = []; };
function revealWorks(now) {
  killWorksST();
  const box = document.getElementById('works'); if (!GS || !box || !motionOK()) return;
  const els = [...box.querySelectorAll(REVEAL)];
  const below = els.filter(isBelow), seen = els.filter(el => !below.includes(el));
  if (now && seen.length) rise(seen, { y: 14, stagger: .06 });
  WORKS_ST = arrive(below);
}
/* redraw only the works list (the material filter); animate = cards already on screen rise in too */
function refreshWorks(animate) {
  const box = document.getElementById('works'); if (!box) return;
  const h = document.documentElement.scrollHeight, y = window.scrollY;
  killWorksST();
  box.innerHTML = worksHTML();
  if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  if (GS && document.documentElement.scrollHeight !== h) ScrollTrigger.refresh();
  revealWorks(animate);
}
const REVEAL = '.sec-head, .works > .work, .rank-row, .req, .review, .offer-card, .how-field .sec-title, .how-field li, .how-field .btn, .band .copy > *, .story, .steps .step';
/* THE FLICKER FIX.
   Before: cards below the screen were fully visible, and only when one was already peeking in (top at 94%) did gsap.from()
   snap it to transparent and fade it back (blink 1). Its lazy photo then often finished loading during that fade and ran its
   own CSS fade from 0 (blink 2). Now: anything wholly below the screen is set to its start state once, up front (gsap.set),
   so it is never seen and then hidden; when it scrolls in, its photos are fetched/decoded first (max 0.6s) and the card
   arrives in ONE tween with its photo already inside. Without GSAP or with reduced motion none of this runs: all visible. */
const isBelow = el => el.getBoundingClientRect().top > window.innerHeight;
const FROM = { autoAlpha: 0, y: 16 };
function photosReady(els) {
  const imgs = els.flatMap(el => [...el.querySelectorAll('img')]).filter(i => !(i.complete && i.naturalWidth));
  if (!imgs.length) return Promise.resolve();
  imgs.forEach(i => { i.loading = 'eager'; });
  const all = Promise.all(imgs.map(i => (i.decode ? i.decode() : Promise.resolve()).catch(() => {})));
  return Promise.race([all, new Promise(r => setTimeout(r, 600))]);
}
function show(els, vars = {}) {
  els = [...els]; if (!els.length) return;
  els.forEach(el => { el.style.transition = 'none'; });
  photosReady(els).then(() => gsap.to(els, { autoAlpha: 1, y: 0, duration: 1, ease: 'expo.out', stagger: .08, overwrite: true, ...vars,
    clearProps: 'opacity,visibility,transform', onComplete: () => els.forEach(el => { el.style.transition = ''; }) }));
}
/* hide now, show once on arrival; returns the triggers so a redraw can kill them */
function arrive(els, vars) {
  els = [...els]; if (!els.length) return [];
  gsap.set(els, FROM);
  return ScrollTrigger.batch(els, { start: 'top bottom', once: true, interval: .08, batchMax: 6, onEnter: batch => show(batch, vars) });
}
/* rise: for fresh content drawn on screen (search results); it never was visible before, so a from() cannot blink */
function rise(els, vars = {}) {
  els = [...els]; if (!els.length) return;
  els.forEach(el => { el.style.transition = 'none'; });
  gsap.from(els, { opacity: 0, y: 16, duration: 1, ease: 'expo.out', stagger: .07, clearProps: 'opacity,transform', ...vars,
    onComplete: () => els.forEach(el => { el.style.transition = ''; }) });
}
function motionFor(c) {
  if (MM) { MM.revert(); MM = null; }
  killWorksST();
  if (!GS || c.s === 'chat' || c.s === 'offer') return;
  const view = document.getElementById('view');
  MM = gsap.matchMedia();
  MM.add('(prefers-reduced-motion: no-preference)', () => {
    const hero = view.querySelector('.hero');
    if (hero) {
      const imgs = [...hero.querySelectorAll('.art img')];
      const drift = gsap.timeline({ repeat: -1, yoyo: true, defaults: { duration: 16, ease: 'sine.inOut' } });
      imgs.forEach((img, i) => drift.fromTo(img, { scale: 1.08, xPercent: 0, yPercent: 0 }, { scale: 1.17, xPercent: i % 2 ? 2.2 : -2.2, yPercent: -1.2 }, 0));
      ScrollTrigger.create({ trigger: hero, start: 'top bottom', end: 'bottom top', onToggle: self => self.isActive ? drift.resume() : drift.pause() });
      gsap.to(imgs, { y: () => hero.offsetHeight * .16, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: .6 } });
      if (hero.classList.contains('intro')) {
        const copy = hero.querySelector('.copy'), words = copy.querySelectorAll('h1 .w > span'), rest = copy.querySelectorAll(':scope > p, :scope > .btn, :scope > .dots');
        rest.forEach(el => { el.style.transition = 'none'; });
        const intro = gsap.timeline({ delay: .2, onComplete: () => rest.forEach(el => { el.style.transition = ''; }) });
        setTimeout(() => { if (intro.progress() < 1) intro.progress(1); }, 6000); /* if the page was opened in the background, never leave words hidden */
        intro
          .from(imgs[0], { opacity: 0, duration: 1.8, ease: 'power2.out' }, 0)
          .from(words, { yPercent: 118, duration: 1.6, ease: 'expo.out', stagger: .085 }, .25)
          .from(rest, { opacity: 0, y: 18, duration: 1.4, ease: 'expo.out', stagger: .13, clearProps: 'opacity,transform' }, '-=1.15')
          .from(hero.querySelector('.credit'), { opacity: 0, duration: 1.4 }, '<');
      }
    }
    view.querySelectorAll('.pfx .art img').forEach(img => gsap.fromTo(img, { yPercent: -6, scale: 1.14 }, { yPercent: 6, scale: 1.14, ease: 'none',
      scrollTrigger: { trigger: img.closest('.pfx'), start: 'top bottom', end: 'bottom top', scrub: .6 } }));
    const targets = [...view.querySelectorAll(REVEAL)].filter(el => isBelow(el) && !el.closest('#works') && !el.closest('#sq-results'));
    revealWorks(false);
    arrive(targets);
    /* a rail arrives as one row: hidden up front, its cards come in together, in order */
    view.querySelectorAll('.rail').forEach(rail => { if (!isBelow(rail)) return; const kids = [...rail.children];
      gsap.set(kids, FROM);
      ScrollTrigger.create({ trigger: rail, start: 'top bottom', once: true, onEnter: () => show(kids, { stagger: .09 }) }); });
    const counts = view.querySelectorAll('[data-count]');
    counts.forEach(el => { const n = +el.dataset.count; if (!n) return; const o = { v: 0 };
      gsap.to(o, { v: n, duration: 2, ease: 'power3.out', delay: .3, onUpdate: () => { el.textContent = Math.round(o.v); } }); });
    return () => { killWorksST(); counts.forEach(el => { el.textContent = el.dataset.count; }); };
  });
}
if (GS) {
  /* magnetic primary buttons: only with a mouse; they lean a few pixels toward the pointer and settle back slowly */
  const fine = window.matchMedia('(prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine)');
  let mag = null;
  const settle = el => gsap.to(el, { '--mx': '0px', '--my': '0px', duration: 1.1, ease: 'expo.out', overwrite: 'auto' });
  document.addEventListener('pointermove', e => {
    if (!fine.matches) return;
    const b = e.target.closest ? e.target.closest('.btn:not(:disabled), .nav .plus .c') : null;
    if (mag && mag !== b) { settle(mag); mag = null; }
    if (!b) return;
    mag = b; const r = b.getBoundingClientRect();
    gsap.to(b, { '--mx': ((e.clientX - r.left) / r.width - .5) * 10 + 'px', '--my': ((e.clientY - r.top) / r.height - .5) * 8 + 'px', duration: .9, ease: 'expo.out', overwrite: 'auto' });
  }, { passive: true });
  document.addEventListener('pointerleave', () => { if (mag) { settle(mag); mag = null; } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => ScrollTrigger.refresh());
}
document.getElementById('view').addEventListener('animationend', e => { if (e.target.id === 'view' || e.target.classList.contains('chat-shell')) e.target.classList.remove('in-fwd', 'in-back', 'in-fade'); });
render();
</script>
</body>
</html>
